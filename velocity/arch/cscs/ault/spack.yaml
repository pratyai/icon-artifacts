spack:
  # VT's .so / standalone are built with nvcc + g++ (not nvfortran), so this
  # env provides cuda + gcc + the sqlite/zlib/zstd the binary links against.
  # It does NOT need nvhpc/hdf5/cmake (that is the cloudsc build).
  #
  # cuda must be >= 12: the standalone is compiled with -std=c++20 and nvcc
  # only accepts c++20 from 12.0 on (11.x caps at c++17). 12.9 matches the CUDA
  # that the icon-gpu env's nvhpc defaults to, so the VT kernels and ICON are
  # built against one toolkit instead of two.
  # gcc must be >= 10: the serde headers include <ranges>, which older
  # libstdc++ does not ship.
  specs:
    - cuda@12.9
    - gcc@12
    - sqlite
    - zlib
    - zstd

  concretizer:
    unify: true
    reuse: true

  # zstd appears twice: an explicit runtime dep (+programs) and a build-only
  # dep of gcc/binutils/tar (~programs); both project to the same view prefix
  # and collide. `link: run` keeps only run-type deps in the view, dropping the
  # build-only copy, so `spack env activate` alone exposes nvcc, g++, sqlite3,
  # and libzstd on PATH/pkg-config — no manual path exports needed.
  view:
    default:
      root: .spack-env/view
      link: run

  packages:
    # Bootstrap compiler only — spack needs something to build gcc@12 with.
    # Everything the VT build actually uses comes from the specs above.
    gcc:
      externals:
        - spec: gcc@8.5.0 languages:='c,c++,fortran'
          prefix: /usr
          extra_attributes:
            compilers:
              c: /usr/bin/gcc
              cxx: /usr/bin/g++
              fortran: /usr/bin/gfortran

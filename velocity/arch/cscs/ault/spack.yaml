spack:
  # VT's .so / standalone are built with nvcc + g++ (not nvfortran), so this
  # env provides cuda + gcc + the sqlite/zlib/zstd the binary links against.
  # It does NOT need nvhpc/hdf5/cmake (that is the cloudsc build).
  #
  # cuda must be >= 12: the standalone is compiled with -std=c++20 and nvcc
  # only accepts c++20 from 12.0 on (11.x caps at c++17).
  # gcc must be >= 10: the serde headers include <ranges>, which older
  # libstdc++ does not ship.
  specs:
    - cuda@12.1.1
    - gcc@12
    - sqlite
    - zlib
    - zstd

  concretizer:
    unify: true
    reuse: true

  # zstd resolves to both +programs (root) and ~programs (dependency), which
  # project to the same view prefix; the build uses `spack load` (per-package
  # prefixes), not the view, so disabling it avoids the collision harmlessly.
  view: false

  packages:
    # Bootstrap compiler only — spack needs something to build gcc@12 with.
    # Everything the VT build actually uses comes from the specs above.
    gcc:
      externals:
        - spec: gcc@8.5.0 languages:='c,c++,fortran'
          prefix: /usr
          extra_attributes:
            compilers:
              c: /usr/bin/gcc
              cxx: /usr/bin/g++
              fortran: /usr/bin/gfortran
